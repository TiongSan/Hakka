<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="客語千字文自學網站：逐句閱讀、雙排拼音、搜尋、收藏與測驗。">
<title>客語千字文｜自學</title>
<style>
:root{
  --bg:#f6f2e9; --paper:#fffdf8; --ink:#27251f; --muted:#756f63;
  --line:#ddd5c6; --accent:#315f52; --accent2:#e8f0ec; --blue:#3269a8;
  --shadow:0 12px 35px rgba(62,50,31,.09); --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,242,233,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(221,213,198,.8)}
.wrap{width:min(1120px,calc(100% - 28px));margin:auto}
.toprow{display:flex;align-items:center;gap:14px;min-height:68px}
.brand{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:800;font-size:22px;letter-spacing:.08em;white-space:nowrap}
.brand small{font-family:inherit;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.05em}
.spacer{flex:1}
.iconbtn,.seg button,.action{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:9px 12px}
.iconbtn:hover,.seg button:hover,.action:hover{border-color:#b8ae9c}
.action.primary{background:var(--accent);color:white;border-color:var(--accent)}
main{padding:26px 0 70px}
.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:20px;align-items:stretch}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero-main{padding:28px}
.eyebrow{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.12em}
h1{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:clamp(34px,5vw,58px);margin:8px 0 10px;line-height:1.12}
.hero p{color:var(--muted);line-height:1.8;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{background:#faf7f0;border:1px solid #ece4d7;border-radius:14px;padding:14px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.progress-card{padding:22px;display:flex;flex-direction:column;justify-content:center}
.progressline{height:10px;background:#ece6db;border-radius:999px;overflow:hidden;margin:12px 0}
.progressline i{display:block;height:100%;background:var(--accent);width:0}
.toolbar{margin-top:20px;padding:16px;display:grid;gap:12px}
.toolbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px 11px 38px;outline:none}
.search input:focus{border-color:var(--accent)}
.search:before{content:"⌕";position:absolute;left:13px;top:7px;font-size:23px;color:var(--muted)}
.seg{display:flex;background:#f1ece3;border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 11px}
.seg button.active{background:var(--paper);box-shadow:0 2px 7px rgba(0,0,0,.08);color:var(--accent);font-weight:700}
.filter-note{font-size:12px;color:var(--muted)}
.section-head{display:flex;align-items:end;gap:12px;margin:28px 2px 12px}
.section-head h2{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;margin:0;font-size:25px}
.section-head span{color:var(--muted);font-size:13px}
.sentence-list{display:grid;gap:14px}
.sentence-card{padding:18px 18px 14px}
.sentence-meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin-bottom:12px}
.badge{border:1px solid var(--line);border-radius:999px;padding:4px 8px;background:#faf7f0}
.done{margin-left:auto;border:0;background:transparent;color:var(--muted)}
.done.on{color:var(--accent);font-weight:700}
.chars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px}
.charbox{position:relative;border:1px solid transparent;border-radius:12px;text-align:center;padding:8px 3px 9px;min-width:0}
.charbox:hover{background:#faf7f0;border-color:#ede5d8}
.hanzi{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:clamp(30px,4.3vw,48px);line-height:1.2}
.py{font-size:13px;color:var(--accent);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.py.lower{color:#7d5e43}
.hide-pinyin .py{visibility:hidden}
.annotation-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(50,105,168,.13)}
.only-annotated .charbox:not(.has-annotation){opacity:.22}
.card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.mini{border:0;background:transparent;color:var(--muted);padding:5px 8px;border-radius:8px}
.mini:hover{background:#f4efe6;color:var(--ink)}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:18px}
.pager button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 13px}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(31,28,23,.34)}
.detail{position:absolute;right:0;top:0;height:100%;width:min(430px,92vw);background:var(--paper);padding:24px;box-shadow:-20px 0 50px rgba(0,0,0,.16);overflow:auto}
.close{float:right;border:0;background:#f3eee5;border-radius:999px;width:36px;height:36px}
.detail-char{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:92px;line-height:1;margin:30px 0 10px}
.detail-sentence{font-size:18px;margin-bottom:24px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px 14px;border-top:1px solid var(--line);padding-top:18px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.blue{color:var(--blue)}
.quiz{display:none;padding:22px;margin-top:14px;text-align:center}
.quiz.open{display:block}
.quiz-char{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:96px;margin:16px 0}
.quiz-answer{min-height:58px;margin:8px auto;color:var(--accent);font-size:20px}
.quiz-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.empty{padding:36px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 0}
@media(max-width:760px){
  .hero{grid-template-columns:1fr}.toprow{min-height:60px}.brand small{display:none}
  .hero-main{padding:22px}.stats{grid-template-columns:repeat(3,1fr)}
  .chars{grid-template-columns:repeat(4,1fr)}.charbox{padding:10px 2px}
  .toolbar-row{align-items:stretch}.seg{width:100%;overflow:auto}.seg button{flex:1;white-space:nowrap}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap toprow">
    <div class="brand">客語千字文 <small>自主學習版</small></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="quizBtn">測驗模式</button>
    <button class="iconbtn" id="resetBtn" title="清除本機學習紀錄">重設進度</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="panel hero-main">
      <div class="eyebrow">HAKKA THOUSAND CHARACTER CLASSIC</div>
      <h1>逐字看、逐句讀，<br>把客語讀音學起來。</h1>
      <p>依原稿保留「原印上排」「原印下排」與藍筆校訂／標記。網站不自行把兩套讀音合併成單一答案。</p>
      <div class="stats">
        <div class="stat"><b id="statChars">1000</b><span>漢字</span></div>
        <div class="stat"><b id="statSentences">125</b><span>句</span></div>
        <div class="stat"><b id="statPages">14</b><span>原稿頁</span></div>
      </div>
    </div>
    <div class="panel progress-card">
      <div class="eyebrow">我的學習進度</div>
      <div style="font-size:28px;font-weight:800;margin-top:4px"><span id="doneCount">0</span> / <span id="totalCount">125</span> 句</div>
      <div class="progressline"><i id="progressBar"></i></div>
      <div class="filter-note">進度與收藏只儲存在這台裝置的瀏覽器。</div>
    </div>
  </section>

  <section class="panel toolbar">
    <div class="toolbar-row">
      <div class="search"><input id="searchInput" placeholder="搜尋漢字、句子或拼音，例如：暑、寒來、cuˋ"></div>
      <button class="action" id="favFilter">☆ 我的收藏</button>
      <button class="action" id="annotationFilter">● 藍筆標記</button>
    </div>
    <div class="toolbar-row">
      <span class="filter-note">拼音：</span>
      <div class="seg" id="modeSeg">
        <button data-mode="upper" class="active">原印上排</button>
        <button data-mode="lower">原印下排</button>
        <button data-mode="both">上下並列</button>
      </div>
      <button class="action" id="hidePinyin">隱藏拼音</button>
      <span class="filter-note" id="resultText"></span>
    </div>
  </section>

  <section class="panel quiz" id="quizPanel">
    <div class="eyebrow">隨機複習</div>
    <div class="quiz-char" id="quizChar">暑</div>
    <div class="quiz-answer" id="quizAnswer">先自己念，再顯示答案</div>
    <div class="quiz-actions">
      <button class="action primary" id="revealQuiz">顯示讀音</button>
      <button class="action" id="nextQuiz">下一題</button>
      <button class="action" id="favQuiz">☆ 收藏這個字</button>
    </div>
  </section>

  <div class="section-head">
    <h2>逐句學習</h2>
    <span id="pageLabel"></span>
  </div>
  <section class="sentence-list" id="sentenceList"></section>
  <div class="pager">
    <button id="prevPage">← 上一頁</button>
    <span id="pagerText"></span>
    <button id="nextPage">下一頁 →</button>
  </div>
</main>

<div class="drawer" id="drawer">
  <div class="backdrop" id="backdrop"></div>
  <aside class="detail">
    <button class="close" id="closeDrawer">×</button>
    <div class="detail-char" id="detailChar"></div>
    <div class="detail-sentence" id="detailSentence"></div>
    <dl class="kv">
      <dt>原印上排</dt><dd id="detailUpper"></dd>
      <dt>原印下排</dt><dd id="detailLower"></dd>
      <dt>原稿位置</dt><dd id="detailLocation"></dd>
      <dt>藍筆標記</dt><dd id="detailAnnotation" class="blue"></dd>
      <dt>備註</dt><dd id="detailNote"></dd>
    </dl>
    <div style="margin-top:24px">
      <button class="action primary" id="detailFav">☆ 加入收藏</button>
    </div>
  </aside>
</div>

<footer class="wrap">資料來源：使用者提供之《客語千字文》掃描資料整理。原稿為掃描影像，正式研究或出版用途仍建議回看原頁核對。</footer>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const state = {
  data:null, mode:localStorage.getItem('hakka-mode')||'upper',
  hidePinyin:false, annotatedOnly:false, favoritesOnly:false,
  search:'', page:1, perPage:12, currentDetail:null, quizItem:null
};
const done = new Set(JSON.parse(localStorage.getItem('hakka-done')||'[]'));
const favorites = new Set(JSON.parse(localStorage.getItem('hakka-favs')||'[]'));

async function loadData(){
  try{
    const res = await fetch('hakka_thousand_chars.json',{cache:'no-store'});
    if(!res.ok) throw new Error('fetch failed');
    return await res.json();
  }catch(e){
    return JSON.parse($('#fallbackData').textContent);
  }
}
function save(){
  localStorage.setItem('hakka-done',JSON.stringify([...done]));
  localStorage.setItem('hakka-favs',JSON.stringify([...favorites]));
}
function flatChars(){
  return state.data.sentences.flatMap(s=>s.chars.map(c=>({...c,page:s.page,line:s.line,text:s.text,sentenceId:s.id})));
}
function matches(s){
  const q=state.search.trim().toLowerCase();
  if(!q) return true;
  return s.text.toLowerCase().includes(q) || s.chars.some(c =>
    c.char.includes(q) || c.upper.toLowerCase().includes(q) || c.lower.toLowerCase().includes(q) ||
    (c.annotation||'').toLowerCase().includes(q)
  );
}
function filteredSentences(){
  return state.data.sentences.filter(s=>{
    if(!matches(s)) return false;
    if(state.annotatedOnly && !s.chars.some(c=>c.annotation)) return false;
    if(state.favoritesOnly && !s.chars.some(c=>favorites.has(c.id))) return false;
    return true;
  });
}
function pyHTML(c){
  if(state.mode==='upper') return `<div class="py">${esc(c.upper)}</div>`;
  if(state.mode==='lower') return `<div class="py lower">${esc(c.lower)}</div>`;
  return `<div class="py">${esc(c.upper)}</div><div class="py lower">${esc(c.lower)}</div>`;
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
  const all=filteredSentences();
  const maxPage=Math.max(1,Math.ceil(all.length/state.perPage));
  state.page=Math.min(state.page,maxPage);
  const start=(state.page-1)*state.perPage, view=all.slice(start,start+state.perPage);
  $('#sentenceList').classList.toggle('hide-pinyin',state.hidePinyin);
  $('#sentenceList').classList.toggle('only-annotated',state.annotatedOnly);
  $('#sentenceList').innerHTML=view.length?view.map(s=>`
    <article class="panel sentence-card">
      <div class="sentence-meta">
        <span class="badge">第 ${s.id} 句</span>
        <span>原稿第 ${s.page} 頁</span>
        <button class="done ${done.has(s.id)?'on':''}" data-done="${s.id}">${done.has(s.id)?'✓ 已學':'○ 標記已學'}</button>
      </div>
      <div class="chars">
        ${s.chars.map(c=>`<button class="charbox ${c.annotation?'has-annotation':''}" data-char="${c.id}" aria-label="${esc(c.char)}">
          ${c.annotation?'<i class="annotation-dot" title="原稿有藍筆標記"></i>':''}
          <div class="hanzi">${esc(c.char)}</div>${pyHTML(c)}
        </button>`).join('')}
      </div>
      <div class="card-actions"><button class="mini" data-copy="${s.id}">複製這句</button></div>
    </article>`).join(''):`<div class="panel empty">沒有符合條件的資料。</div>`;
  $('#pagerText').textContent=`${state.page} / ${maxPage}`;
  $('#prevPage').disabled=state.page<=1; $('#nextPage').disabled=state.page>=maxPage;
  $('#resultText').textContent=`顯示 ${all.length} / ${state.data.sentenceCount} 句`;
  $('#pageLabel').textContent=state.search||state.annotatedOnly||state.favoritesOnly?'篩選結果':'依原稿順序';
  bindCards();
  updateProgress();
}
function bindCards(){
  $$('[data-char]').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.char)));
  $$('[data-done]').forEach(b=>b.onclick=()=>{
    const id=Number(b.dataset.done); done.has(id)?done.delete(id):done.add(id); save(); render();
  });
  $$('[data-copy]').forEach(b=>b.onclick=async()=>{
    const s=state.data.sentences.find(x=>x.id===Number(b.dataset.copy));
    const line=s.chars.map(c=>c.char).join('');
    const p=s.chars.map(c=>state.mode==='lower'?c.lower:c.upper).join(' ');
    try{await navigator.clipboard.writeText(line+'\n'+p); b.textContent='已複製'; setTimeout(()=>b.textContent='複製這句',1000)}catch(e){}
  });
}
function updateProgress(){
  $('#doneCount').textContent=done.size; $('#totalCount').textContent=state.data.sentenceCount;
  $('#progressBar').style.width=`${Math.min(100,done.size/state.data.sentenceCount*100)}%`;
}
function getChar(id){return flatChars().find(c=>c.id===id)}
function openDetail(id){
  const c=getChar(id); if(!c)return; state.currentDetail=c;
  $('#detailChar').textContent=c.char; $('#detailSentence').textContent=c.text;
  $('#detailUpper').textContent=c.upper||'—'; $('#detailLower').textContent=c.lower||'—';
  $('#detailLocation').textContent=`第 ${c.page} 頁・本頁第 ${c.line} 句・句中第 ${c.position} 字`;
  $('#detailAnnotation').textContent=c.annotation||'無'; $('#detailNote').textContent=c.note||'—';
  $('#detailFav').textContent=favorites.has(c.id)?'★ 已收藏':'☆ 加入收藏';
  $('#drawer').classList.add('open');
}
function closeDrawer(){ $('#drawer').classList.remove('open') }
function newQuiz(){
  let pool=flatChars(); if(state.favoritesOnly && favorites.size) pool=pool.filter(c=>favorites.has(c.id));
  state.quizItem=pool[Math.floor(Math.random()*pool.length)];
  $('#quizChar').textContent=state.quizItem.char; $('#quizAnswer').textContent='先自己念，再顯示答案';
  $('#favQuiz').textContent=favorites.has(state.quizItem.id)?'★ 已收藏':'☆ 收藏這個字';
}
function setMode(mode){
  state.mode=mode; localStorage.setItem('hakka-mode',mode);
  $$('#modeSeg button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode)); render();
}
$('#searchInput').oninput=e=>{state.search=e.target.value;state.page=1;render()}
$('#modeSeg').onclick=e=>{if(e.target.dataset.mode)setMode(e.target.dataset.mode)}
$('#hidePinyin').onclick=()=>{state.hidePinyin=!state.hidePinyin;$('#hidePinyin').textContent=state.hidePinyin?'顯示拼音':'隱藏拼音';render()}
$('#annotationFilter').onclick=()=>{state.annotatedOnly=!state.annotatedOnly;state.page=1;$('#annotationFilter').classList.toggle('primary',state.annotatedOnly);render()}
$('#favFilter').onclick=()=>{state.favoritesOnly=!state.favoritesOnly;state.page=1;$('#favFilter').classList.toggle('primary',state.favoritesOnly);render()}
$('#prevPage').onclick=()=>{state.page--;render();scrollTo({top:$('.section-head').offsetTop-80,behavior:'smooth'})}
$('#nextPage').onclick=()=>{state.page++;render();scrollTo({top:$('.section-head').offsetTop-80,behavior:'smooth'})}
$('#backdrop').onclick=closeDrawer; $('#closeDrawer').onclick=closeDrawer;
$('#detailFav').onclick=()=>{if(!state.currentDetail)return;const id=state.currentDetail.id;favorites.has(id)?favorites.delete(id):favorites.add(id);save();openDetail(id);render()}
$('#quizBtn').onclick=()=>{$('#quizPanel').classList.toggle('open');if($('#quizPanel').classList.contains('open')){newQuiz();$('#quizPanel').scrollIntoView({behavior:'smooth',block:'center'})}}
$('#revealQuiz').onclick=()=>{const c=state.quizItem;if(!c)return;$('#quizAnswer').innerHTML=`上排：<b>${esc(c.upper)}</b><br>下排：<b>${esc(c.lower)}</b>${c.annotation?`<br><span class="blue">原稿標記：${esc(c.annotation)}</span>`:''}`}
$('#nextQuiz').onclick=newQuiz;
$('#favQuiz').onclick=()=>{const c=state.quizItem;if(!c)return;favorites.has(c.id)?favorites.delete(c.id):favorites.add(c.id);save();newQuiz();render()}
$('#resetBtn').onclick=()=>{if(confirm('要清除這台裝置上的學習進度與收藏嗎？')){done.clear();favorites.clear();save();render()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

loadData().then(data=>{
  state.data=data;

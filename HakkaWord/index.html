<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="客語句子學習：四縣、海陸公開語料，搭配即時拼音與 AI 合成試聽。">
<title>客語句子學習</title>
<style>
:root{
  --bg:#f6f2e9;--paper:#fffdf8;--ink:#29261f;--muted:#756e61;--line:#ddd5c6;
  --accent:#315f52;--accent2:#e8f0ec;--blue:#3269a8;--warn:#9a6700;--bad:#a33a3a;
  --shadow:0 12px 35px rgba(62,50,31,.08);--radius:18px
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,242,233,.93);backdrop-filter:blur(12px);border-bottom:1px solid rgba(221,213,198,.8)}
.wrap{width:min(1120px,calc(100% - 28px));margin:auto}
.toprow{display:flex;align-items:center;gap:12px;min-height:66px}
.brand{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:800;font-size:22px;letter-spacing:.06em}
.brand small{font-family:inherit;color:var(--muted);font-size:12px;font-weight:500}
.spacer{flex:1}.navbtn,.action,.seg button,.pager button,.pager select{
 border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:11px;padding:9px 12px;text-decoration:none
}
.action.primary,.seg button.active{background:var(--accent);color:white;border-color:var(--accent)}
main{padding:26px 0 65px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:1.45fr .75fr;gap:18px}.hero-main{padding:28px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;color:var(--accent)}
h1{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:clamp(34px,5vw,58px);line-height:1.12;margin:8px 0 12px}
.lead{color:var(--muted);line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{background:#faf7f0;border:1px solid #ece4d7;border-radius:14px;padding:14px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.progress{padding:22px;display:flex;flex-direction:column;justify-content:center}.bar{height:10px;background:#ece6db;border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--accent);width:0}
.toolbar{margin-top:18px;padding:16px;display:grid;gap:12px}.toolbar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:230px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;outline:none}
.seg{display:flex;gap:3px;background:#f1ece3;border-radius:12px;padding:3px}.seg button{border:0;background:transparent}.seg button.active{box-shadow:0 2px 7px rgba(0,0,0,.08)}
.note{font-size:12px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:27px 2px 12px}.section-head h2{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;margin:0;font-size:25px}
.list{display:grid;gap:14px}.card{padding:18px}.meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
.badge{display:inline-block;border:1px solid var(--line);background:#faf7f0;border-radius:999px;padding:4px 8px}
.done{margin-left:auto;border:0;background:transparent;color:var(--muted)}.done.on{color:var(--accent);font-weight:800}
.sentence{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:clamp(28px,4.2vw,45px);line-height:1.5;margin:12px 0 6px}
.pron{min-height:28px;color:var(--accent);font-size:16px;line-height:1.65;word-break:break-word}.pron.pending{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.smallbtn{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 11px}.smallbtn:disabled{opacity:.45}
.source{margin-top:10px;color:var(--muted);font-size:12px}.statusline{font-size:12px;margin-top:8px;color:var(--muted)}.statusline.warn{color:var(--warn)}.statusline.bad{color:var(--bad)}
audio{width:min(100%,430px);margin-top:9px}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}.pager select{max-width:min(430px,65vw)}
.quiz{display:none;margin-top:18px;padding:24px;text-align:center}.quiz.open{display:block}.quiz-text{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:48px;margin:20px 0}.quiz-answer{min-height:54px;color:var(--accent);line-height:1.7}
.empty{text-align:center;color:var(--muted);padding:35px}footer{padding:30px 0;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
@media(max-width:760px){.hero{grid-template-columns:1fr}.toprow{min-height:58px}.brand small{display:none}.hero-main{padding:22px}.toolbar-row{align-items:stretch}.seg{width:100%}.seg button{flex:1}.navbtn.hide-sm{display:none}}
</style>
</head>
<body>
<header class="topbar">
 <div class="wrap toprow">
  <div class="brand">客語句子學習 <small>公開語料版 v2.0</small></div>
  <div class="spacer"></div>
  <button class="navbtn" id="quizBtn">隨機複習</button>
  <a class="navbtn hide-sm" href="about.html">關於／授權</a>
 </div>
</header>

<main class="wrap">
 <section class="hero">
  <div class="panel hero-main">
   <div class="eyebrow">TAIWANESE HAKKA SENTENCE LEARNING</div>
   <h1>用真實客語句子，<br>練習四縣與海陸。</h1>
   <div class="lead">以公開客語文本為核心。拼音與發音由第三方 AI 服務即時產生，屬學習輔助，不視為官方人工校訂。</div>
   <div class="stats">
    <div class="stat"><b id="statAll">20</b><span>目前句子</span></div>
    <div class="stat"><b id="statSixian">10</b><span>四縣</span></div>
    <div class="stat"><b id="statHailu">10</b><span>海陸</span></div>
   </div>
  </div>
  <div class="panel progress">
   <div class="eyebrow">我的學習進度</div>
   <div style="font-size:28px;font-weight:800"><span id="doneCount">0</span> / <span id="totalCount">20</span> 句</div>
   <div class="bar"><i id="bar"></i></div>
   <div class="note">進度、收藏與已取得的拼音只存在此瀏覽器。</div>
  </div>
 </section>

 <section class="panel toolbar">
  <div class="toolbar-row">
   <div class="search"><input id="search" placeholder="搜尋客語文字或來源人物"></div>
   <button class="action" id="favOnly">☆ 我的收藏</button>
  </div>
  <div class="toolbar-row">
   <span class="note">腔調：</span>
   <div class="seg" id="dialectSeg">
    <button data-dialect="all" class="active">全部</button>
    <button data-dialect="sixian">四縣</button>
    <button data-dialect="hailu">海陸</button>
   </div>
   <span class="note" id="resultInfo"></span>
  </div>
 </section>

 <section class="panel quiz" id="quizPanel">
  <div class="eyebrow">隨機複習</div>
  <div class="quiz-text" id="quizText"></div>
  <div class="quiz-answer" id="quizAnswer">先自己讀，再顯示 AI 拼音／試聽。</div>
  <div class="tools" style="justify-content:center">
   <button class="action primary" id="quizReveal">取得拼音與發音</button>
   <button class="action" id="quizNext">下一句</button>
  </div>
  <div id="quizAudio"></div>
 </section>

 <div class="section-head">
  <h2>逐句學習</h2>
  <span class="note">點「取得拼音／發音」時才會連線第三方 TTS</span>
 </div>
 <section class="list" id="list"></section>

 <div class="pager">
  <button id="prev">← 上一頁</button>
  <select id="pageJump"></select>
  <span id="pagerText"></span>
  <button id="next">下一頁 →</button>
 </div>
</main>

<footer class="wrap">
 本站為非商業教育、自學與研究用途。文字來源、AI 發音、第三方服務與隱私說明請見

</footer>

<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
const $=s=>document.querySelector(s);
const state={data:null,dialect:"all",search:"",favOnly:false,page:1,perPage:8,app:null,endpoint:"/predict",endpointInfo:null,quiz:null};
const done=new Set(JSON.parse(localStorage.getItem("hakka2-done")||"[]"));
const favs=new Set(JSON.parse(localStorage.getItem("hakka2-favs")||"[]"));
const pronCache=JSON.parse(localStorage.getItem("hakka2-pron")||"{}");

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function save(){localStorage.setItem("hakka2-done",JSON.stringify([...done]));localStorage.setItem("hakka2-favs",JSON.stringify([...favs]));localStorage.setItem("hakka2-pron",JSON.stringify(pronCache))}
async function loadData(){try{const r=await fetch("data.json",{cache:"no-store"});if(!r.ok)throw 0;return await r.json()}catch{return JSON.parse($("#fallback").textContent)}}
function filtered(){
 const q=state.search.trim().toLowerCase();
 return state.data.items.filter(x=>(state.dialect==="all"||x.dialect===state.dialect)&&(!state.favOnly||favs.has(x.id))&&(!q||x.text.toLowerCase().includes(q)||x.sourcePerson.toLowerCase().includes(q)));
}
function updateStats(){
 $("#doneCount").textContent=done.size;$("#totalCount").textContent=state.data.items.length;
 $("#bar").style.width=Math.min(100,done.size/state.data.items.length*100)+"%";
 $("#statAll").textContent=state.data.items.length;
 $("#statSixian").textContent=state.data.items.filter(x=>x.dialect==="sixian").length;
 $("#statHailu").textContent=state.data.items.filter(x=>x.dialect==="hailu").length;
}
function render(){
 const all=filtered(),max=Math.max(1,Math.ceil(all.length/state.perPage));state.page=Math.min(state.page,max);
 const view=all.slice((state.page-1)*state.perPage,state.page*state.perPage);
 $("#list").innerHTML=view.length?view.map(x=>{
  const c=pronCache[x.id];
  return `<article class="panel card">
   <div class="meta">
    <span class="badge">${x.dialectLabel}</span><span>${esc(x.sourcePerson)}</span>
    <button class="done ${done.has(x.id)?"on":""}" data-done="${x.id}">${done.has(x.id)?"✓ 已學":"○ 標記已學"}</button>
   </div>
   <div class="sentence">${esc(x.text)}</div>
   <div class="pron ${c?"":"pending"}" id="pron-${x.id}">${c?esc(c.pron):"尚未取得 AI 拼音"}</div>
   <div id="audio-${x.id}"></div>
   <div class="tools">
    <button class="smallbtn" data-tts="${x.id}">🔊 取得拼音／發音</button>
    <button class="smallbtn" data-fav="${x.id}">${favs.has(x.id)?"★ 已收藏":"☆ 收藏"}</button>
   </div>
   <div class="statusline" id="status-${x.id}"></div>
   <div class="source">來源：${esc(x.sourceType)}・${esc(x.sourcePerson)}</div>
  </article>`}).join(""):`<div class="panel empty">沒有符合條件的句子。</div>`;
 $("#resultInfo").textContent=`顯示 ${all.length} / ${state.data.items.length} 句`;
 $("#pagerText").textContent=`${state.page} / ${max}`;
 $("#prev").disabled=state.page<=1;$("#next").disabled=state.page>=max;
 $("#pageJump").innerHTML=Array.from({length:max},(_,i)=>{const first=all[i*state.perPage];const p=i+1;return `<option value="${p}" ${p===state.page?"selected":""}>第 ${p} 頁｜${first?esc(first.text.slice(0,10))+"…":""}</option>`}).join("");
 document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const id=+b.dataset.done;done.has(id)?done.delete(id):done.add(id);save();render()});
 document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{const id=+b.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);save();render()});
 document.querySelectorAll("[data-tts]").forEach(b=>b.onclick=()=>runTTS(+b.dataset.tts,b));
 updateStats();
}
function scoreEndpoint(name,info){const ps=info?.parameters||[];const t=(name+" "+ps.map(p=>(p.parameter_name||"")+" "+(p.label||"")).join(" ")).toLowerCase();return (/tts|predict|synth/.test(t)?4:0)+(/text|文字/.test(t)?3:0)+(/dialect|腔/.test(t)?2:0)}
function paramText(p){return `${p?.parameter_name||""} ${p?.label||""} ${p?.component||""}`.toLowerCase()}
function choices(p){for(const x of [p?.choices,p?.component_props?.choices,p?.props?.choices])if(Array.isArray(x)&&x.length)return x.map(v=>Array.isArray(v)?v[1]??v[0]:v);return []}
function def(p){const meta=(String(p?.type||"")+" "+String(p?.python_type?.type||"")+" "+String(p?.component||"")+" "+paramText(p)).toLowerCase();if(/file|filepath|audio|upload/.test(meta))return null;if(p?.default!=null)return p.default;const c=choices(p);if(c.length)return c[0];if(/number|float|int/.test(meta))return 1;if(/bool/.test(meta))return false;return ""}
function payload(item){return (state.endpointInfo?.parameters||[]).map(p=>{const t=paramText(p),cs=choices(p);
 if(/file|filepath|upload|audio|wav|mp3|上傳|音檔|客製化語音|參考音/.test(t))return null;
 if(/text|文字|句子|content|input/.test(t)&&!/speaker|voice|語者/.test(t))return item.text;
 if(/dialect|方言|腔調|腔/.test(t))return item.dialect;
 if(/model|模型/.test(t))return "yourtts-htia-240704";
 if(/語者類型|speaker type|voice type/.test(t))return "預設語者";
 if(/speaker|voice|語者|聲音|音色/.test(t))return cs.length?cs[0]:"XF";
 if(/language|語言/.test(t))return cs.length?cs[0]:"hak";
 if(/speed|語速|rate/.test(t))return 1;
 return def(p);
})}
function findAudio(v){if(!v)return null;if(typeof v==="string"&&/\.(wav|mp3|ogg|m4a)(\?|$)/i.test(v))return v;if(Array.isArray(v)){for(const x of v){const h=findAudio(x);if(h)return h}}if(typeof v==="object"){for(const k of ["url","path"]){const x=v[k];if(typeof x==="string"&&(/^https?:\/\//.test(x)||/\.(wav|mp3|ogg|m4a)(\?|$)/i.test(x)))return x}for(const x of Object.values(v)){const h=findAudio(x);if(h)return h}}return null}
function collectText(v){const out=[];const walk=x=>{if(x==null)return;if(typeof x==="string"&&!/^https?:\/\//.test(x)&&!/\.(wav|mp3|ogg|m4a)(\?|$)/i.test(x)&&x.length<600)out.push(x);else if(Array.isArray(x))x.forEach(walk);else if(typeof x==="object")Object.values(x).forEach(walk)};walk(v);return [...new Set(out)].join(" ｜ ")}
async function connect(){
 if(state.app)return;
 state.app=await Client.connect("ivanusto/tw-hakka-tts");
 const api=await state.app.view_api();let eps=Object.entries(api?.named_endpoints||{});
 if(eps.length){eps.sort((a,b)=>scoreEndpoint(b[0],b[1])-scoreEndpoint(a[0],a[1]));[state.endpoint,state.endpointInfo]=eps[0]}else state.endpointInfo=null;
}
async function synth(item){
 await connect();
 const result=await state.app.predict(state.endpoint,payload(item));
 const data=result?.data??result;
 return {pron:collectText(data),audio:findAudio(data)};
}
async function runTTS(id,btn){
 const item=state.data.items.find(x=>x.id===id),status=$("#status-"+id),pron=$("#pron-"+id),aud=$("#audio-"+id);
 btn.disabled=true;status.textContent="正在連線並合成…";status.className="statusline warn";
 try{
  const r=await synth(item);
  if(r.pron){pron.textContent=r.pron;pron.classList.remove("pending");pronCache[id]={pron:r.pron,ts:Date.now()};save()}
  if(r.audio){let u=r.audio;if(!/^https?:\/\//.test(u)){const root=state.app?.config?.root||state.app?.config?.root_url||"https://ivanusto-tw-hakka-tts.hf.space";u=String(root).replace(/\/$/,"")+"/file="+u.replace(/^file=/,"")}aud.innerHTML=`<audio controls autoplay src="${esc(u)}"></audio>`}
  status.textContent="AI 拼音／合成音已取得。請以學習輔助方式使用。";status.className="statusline";
 }catch(e){status.textContent="第三方發音服務暫時無法使用："+(e?.message||e);status.className="statusline bad"}
 finally{btn.disabled=false}
}
function newQuiz(){const pool=filtered().length?filtered():state.data.items;state.quiz=pool[Math.floor(Math.random()*pool.length)];$("#quizText").textContent=state.quiz.text;$("#quizAnswer").textContent=pronCache[state.quiz.id]?.pron||"先自己讀，再顯示 AI 拼音／試聽。";$("#quizAudio").innerHTML=""}
$("#quizBtn").onclick=()=>{$("#quizPanel").classList.toggle("open");if($("#quizPanel").classList.contains("open")){newQuiz();$("#quizPanel").scrollIntoView({behavior:"smooth",block:"center"})}}
$("#quizNext").onclick=newQuiz;
$("#quizReveal").onclick=async()=>{if(!state.quiz)return;$("#quizAnswer").textContent="取得中…";try{const r=await synth(state.quiz);if(r.pron){$("#quizAnswer").textContent=r.pron;pronCache[state.quiz.id]={pron:r.pron,ts:Date.now()};save()}if(r.audio){let u=r.audio;if(!/^https?:\/\//.test(u)){const root=state.app?.config?.root||"https://ivanusto-tw-hakka-tts.hf.space";u=String(root).replace(/\/$/,"")+"/file="+u.replace(/^file=/,"")}$("#quizAudio").innerHTML=`<audio controls autoplay src="${esc(u)}"></audio>`}}catch(e){$("#quizAnswer").textContent="發音服務暫時無法使用。"}}
$("#search").oninput=e=>{state.search=e.target.value;state.page=1;render()}
$("#dialectSeg").onclick=e=>{if(!e.target.dataset.dialect)return;state.dialect=e.target.dataset.dialect;state.page=1;document.querySelectorAll("#dialectSeg button").forEach(b=>b.classList.toggle("active",b.dataset.dialect===state.dialect));render()}
$("#favOnly").onclick=()=>{state.favOnly=!state.favOnly;state.page=1;$("#favOnly").classList.toggle("primary",state.favOnly);render()}
$("#prev").onclick=()=>{state.page--;render();scrollTo({top:document.querySelector(".section-head").offsetTop-80,behavior:"smooth"})}
$("#next").onclick=()=>{state.page++;render();scrollTo({top:document.querySelector(".section-head").offsetTop-80,behavior:"smooth"})}
$("#pageJump").onchange=e=>{state.page=+e.target.value||1;render();scrollTo({top:document.querySelector(".section-head").offsetTop-80,behavior:"smooth"})}
loadData().then(d=>{state.data=d;render()});
</script>
